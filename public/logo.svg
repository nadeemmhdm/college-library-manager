<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Rounded Shield Container -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgGrad)" stroke="url(#blueGlow)" stroke-width="4" filter="url(#dropShadow)" />

  <!-- Inner Subtle Hex / Shield Accent -->
  <path d="M128 36 L204 76 L204 156 L128 216 L52 156 L52 76 Z" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" opacity="0.4" />

  <!-- Open Book Base -->
  <g transform="translate(128, 148)">
    <!-- Book Spine Glow -->
    <path d="M0 16 L-74 -8 C-44 -16 -16 -12 0 -2 C16 -12 44 -16 74 -8 L0 16 Z" fill="url(#blueGlow)" opacity="0.25" />
    
    <!-- Left Pages -->
    <path d="M-6 -4 C-28 -14 -56 -18 -84 -10 L-84 36 C-56 28 -28 32 -6 42 Z" fill="url(#pageGrad)" stroke="#CBD5E1" stroke-width="2" />
    <path d="M-6 4 C-28 -6 -56 -10 -80 -2 L-80 34 C-56 26 -28 30 -6 40 Z" fill="#F8FAFC" opacity="0.9" />
    <!-- Page Text Lines -->
    <line x1="-70" y1="10" x2="-22" y2="2" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-70" y1="18" x2="-26" y2="10" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-70" y1="26" x2="-35" y2="18" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Right Pages -->
    <path d="M6 -4 C28 -14 56 -18 84 -10 L84 36 C56 28 28 32 6 42 Z" fill="url(#pageGrad)" stroke="#CBD5E1" stroke-width="2" />
    <path d="M6 4 C28 -6 56 -10 80 -2 L80 34 C56 26 28 30 6 40 Z" fill="#F8FAFC" opacity="0.9" />
    <!-- Page Text Lines -->
    <line x1="22" y1="2" x2="70" y2="10" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="26" y1="10" x2="70" y2="18" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="35" y1="18" x2="70" y2="26" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Book Center Spine Ridge -->
    <path d="M0 -6 L0 44" stroke="#2563EB" stroke-width="4" stroke-linecap="round" />
    <!-- Bookmark Ribbon -->
    <path d="M0 44 L0 58 L5 53 L10 58 L10 44 Z" fill="#EF4444" />
  </g>

  <!-- Academic Graduation Mortarboard / Cap -->
  <g transform="translate(128, 92)">
    <!-- Cap Diamond / Top -->
    <polygon points="0,-32 76,-8 0,16 -76,-8" fill="url(#goldGrad)" stroke="#B45309" stroke-width="2" />
    <polygon points="0,-27 68,-7 0,13 -68,-7" fill="#FBBF24" opacity="0.6" />

    <!-- Skull Cap Base -->
    <path d="M-36 0 L-36 16 C-36 28 36 28 36 16 L36 0 C24 8 -24 8 -36 0 Z" fill="#B45309" stroke="#78350F" stroke-width="1.5" />

    <!-- Button & Golden Tassel -->
    <circle cx="0" cy="-8" r="4.5" fill="#FEF08A" stroke="#B45309" stroke-width="1" />
    <path d="M0 -8 C20 -4 44 4 48 20 L52 36" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="52" cy="38" r="3" fill="#D97706" />
  </g>

  <!-- Stars / Excellence Sparkles -->
  <polygon points="56,66 58,72 64,74 58,76 56,82 54,76 48,74 54,72" fill="#38BDF8" opacity="0.8" />
  <polygon points="200,66 202,72 208,74 202,76 200,82 198,76 192,74 198,72" fill="#FBBF24" opacity="0.8" />
</svg>